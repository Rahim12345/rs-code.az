<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff;
 background:radial-gradient(circle at 85% 15%,#1d4e7a 0,transparent 35%),radial-gradient(circle at 10% 85%,#1f4a5e 0,transparent 30%),linear-gradient(135deg,#0c1e33,#123150 55%,#0e2540);position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px}
.dots{position:absolute;left:46px;top:74px} .dots i{display:block;border-radius:50%;background:#22d3ee;margin:0 auto 12px}
.badge{position:absolute;left:80px;top:110px;border:2px solid #22d3ee;border-radius:20px;padding:8px 44px;color:#22d3ee;font-weight:700;font-size:14px}
.t{position:absolute;left:80px;top:160px;font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:68px;line-height:1.05}
.acc{font-style:italic;font-weight:400;color:#facc15;font-size:44px;margin-top:10px}
.year{position:absolute;left:80px;top:360px;font-size:118px;font-weight:800;color:rgba(255,255,255,.07)}
.sub{position:absolute;left:80px;top:482px;font-size:20px;color:#b8c7d9}
.line{position:absolute;left:80px;top:538px;width:100px;height:3px;background:#22d3ee}
.lang{position:absolute;right:60px;top:40px;background:#22d3ee;color:#0c1e33;font-weight:800;font-size:14px;border-radius:14px;padding:6px 20px}
.win{position:absolute;left:760px;top:110px;width:360px;border:2px solid #22d3ee;border-radius:12px;background:rgba(12,30,51,.85);overflow:hidden}
.bar{height:32px;background:#16324f;display:flex;align-items:center;padding:0 10px;gap:7px}
.bar i{width:10px;height:10px;border-radius:50%} .url{flex:1;margin-left:10px;background:#0c1e33;border-radius:8px;height:16px;font:10px monospace;color:#22d3ee;padding-left:10px;line-height:16px}
.body{padding:16px 18px}
.search{background:#fff;color:#334155;border-radius:18px;font-size:12px;padding:7px 14px;display:flex;justify-content:space-between}
.res{margin-top:12px;border:1px solid #22d3ee55;border-radius:8px;padding:9px 10px;display:flex;gap:10px;align-items:center;background:#10304d}
.rank{background:#facc15;color:#0c1e33;font-weight:800;border-radius:6px;padding:4px 7px;font-size:13px}
.res b{display:block;font-size:12px;color:#7dd3fc} .res span{font-size:10px;color:#94a3b8}
.cards{display:flex;gap:8px;margin-top:12px}
.card{flex:1;border:1px solid #22d3ee88;border-radius:6px;padding:8px} .card.hl{border-color:#facc15}
.card small{font-size:10px;color:#94a3b8;display:block} .card.hl small{color:#facc15}
.card b{font-size:16px;display:block;margin:6px 0 3px} .card em{font-style:normal;font-size:9px;color:#4ade80}
.pin{position:absolute;left:1030px;top:392px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:#facc15;letter-spacing:1px}
.brand{position:absolute;left:760px;top:520px;display:flex;gap:15px;align-items:center}
.logo{width:50px;height:50px;background:#22d3ee;border-radius:8px;color:#0c1e33;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
.brand b{font-size:18px;display:block} .brand span{font-size:12px;color:#94a3b8}
</style></head><body>
<div class="grid"></div>
<div class="dots"><i style="width:7px;height:7px"></i><i style="width:5px;height:5px;opacity:.7"></i><i style="width:4px;height:4px;opacity:.4"></i></div>
<div class="lang">%%LANG%%</div>
<div class="badge">%%BADGE%%</div>
<div class="t">%%T1%%<br>%%T2%%<div class="acc">%%ACC%%</div></div>
<div class="year">2026</div>
<div class="sub">%%SUB%%</div><div class="line"></div>
<div class="win"><div class="bar"><i style="background:#f87171"></i><i style="background:#fbbf24"></i><i style="background:#4ade80"></i><div class="url">google.az</div></div>
<div class="body"><div class="search"><span>%%Q%%</span><span>🔍</span></div>
<div class="res"><span class="rank">#1</span><div><b>%%R1%%</b><span>rs-code.az — %%R2%%</span></div></div>
<div class="cards">%%CARDS%%</div></div></div>
<div class="pin"><svg width="22" height="28" viewBox="0 0 24 30"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.5 12 30 12 30s12-9.5 12-18.3C24 5.2 18.6 0 12 0z" fill="#facc15"/><circle cx="12" cy="11.5" r="4.5" fill="#0c1e33"/></svg>%%PIN%%</div>
<div class="brand"><div class="logo">RS</div><div><b>RS Code</b><span>%%TAG%%</span></div></div>
</body></html>
