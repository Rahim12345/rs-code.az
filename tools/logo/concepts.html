<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{width:1600px;background:#0b0b10;font-family:'Space Grotesk',sans-serif;color:#fff;padding:40px}
.row{display:grid;grid-template-columns:70px 1fr 1fr 220px;gap:24px;align-items:center;margin-bottom:28px}
.n{font-size:56px;font-weight:700;color:#7c3aed}
.box{height:190px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.dark{background:#09090b;border:1px solid #27272a}.light{background:#fafafa}
.fav{display:flex;gap:18px;align-items:flex-end;justify-content:center;background:#18181b;height:190px;border-radius:18px}
.wm{display:flex;align-items:center;gap:18px}
.t{font-size:58px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.light .t{color:#18181b}.t .g{background:linear-gradient(90deg,#8b5cf6,#d946ef);-webkit-background-clip:text;color:transparent}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:-2px}
.cap{display:inline-block;width:26px;height:6px;background:#22d3ee;margin-left:6px;vertical-align:baseline;border-radius:2px}
h2{font-size:15px;color:#a1a1aa;font-weight:500;margin:0 0 6px 94px;letter-spacing:.5px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
<symbol id="m1" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="url(#g)"/>
 <path d="M21 18 L11 32 L21 46" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M43 18 L53 32 L43 46" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M39 22c-2-3-5-4-8-4-4 0-7 2-7 6 0 8 15 5 15 13 0 4-3 7-8 7-4 0-7-2-8-5" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/></symbol>
<symbol id="m2" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#111827"/><rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#g)" stroke-width="3"/>
 <path d="M18 46V18h11a8 8 0 0 1 0 16H18M29 34l9 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="42" y="42" width="11" height="5" rx="1.5" fill="#22d3ee"/></symbol>
<symbol id="m3" viewBox="0 0 64 64"><rect width="64" height="64" rx="32" fill="url(#g)"/>
 <path d="M44 17H28a8 8 0 0 0 0 16h8a8 8 0 0 1 0 16H20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
 <circle cx="44" cy="17" r="5" fill="#22d3ee"/><circle cx="20" cy="49" r="5" fill="#fff"/></symbol>
</defs></svg>

<h2>1 · KOD MÖTƏRİZƏSİ — &lt; S &gt;: kod içində doğulan brend</h2>
<div class="row"><div class="n">1</div>
 <div class="box dark"><div class="wm"><svg width="96" height="96"><use href="#m1"/></svg><div class="t">rs <span class="g">code</span></div></div></div>
 <div class="box light"><div class="wm"><svg width="96" height="96"><use href="#m1"/></svg><div class="t">rs <span class="g">code</span></div></div></div>
 <div class="fav"><svg width="64" height="64"><use href="#m1"/></svg><svg width="32" height="32"><use href="#m1"/></svg><svg width="16" height="16"><use href="#m1"/></svg></div></div>

<h2>2 · TERMİNAL KURSORU — R + yanıb-sönən kursor: "yazırıq, işləyir"</h2>
<div class="row"><div class="n">2</div>
 <div class="box dark"><div class="wm"><svg width="96" height="96"><use href="#m2"/></svg><div class="t mono">rs.code<span class="cap"></span></div></div></div>
 <div class="box light"><div class="wm"><svg width="96" height="96"><use href="#m2"/></svg><div class="t mono">rs.code<span class="cap"></span></div></div></div>
 <div class="fav"><svg width="64" height="64"><use href="#m2"/></svg><svg width="32" height="32"><use href="#m2"/></svg><svg width="16" height="16"><use href="#m2"/></svg></div></div>

<h2>3 · FİKİRDƏN MƏHSULA — S xətti iki nöqtəni birləşdirir (ideya → hazır məhsul)</h2>
<div class="row"><div class="n">3</div>
 <div class="box dark"><div class="wm"><svg width="96" height="96"><use href="#m3"/></svg><div class="t">RS <span class="g">Code</span></div></div></div>
 <div class="box light"><div class="wm"><svg width="96" height="96"><use href="#m3"/></svg><div class="t">RS <span class="g">Code</span></div></div></div>
 <div class="fav"><svg width="64" height="64"><use href="#m3"/></svg><svg width="32" height="32"><use href="#m3"/></svg><svg width="16" height="16"><use href="#m3"/></svg></div></div>
</body></html>
